<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Micro-SaaS</title><style>body{font-family:system-ui;max-width:760px;margin:40px auto;padding:0 18px;line-height:1.5}input,textarea,button{font:inherit;padding:10px;margin:6px 0;width:100%;box-sizing:border-box}button{cursor:pointer}.card{border:1px solid #ccc;border-radius:12px;padding:18px;margin-top:18px}small{opacity:.7}</style></head><body><h1>AI Micro-SaaS</h1><p>Turn one business pain into a focused paid tool with an MVP workflow and pricing test.</p><div class="card"><label>Business / problem</label><textarea id="input" rows="4" placeholder="Describe the business problem or opportunity"></textarea><button onclick="run()">Generate next action</button><div id="out"></div></div><p><small>Ultron modular MVP • TEST mode • No payment or irreversible action is executed here.</small></p><script>function run(){const v=document.getElementById('input').value.trim();document.getElementById('out').innerHTML=v?'<h3>Next action</h3><p>Qualify this opportunity, produce the smallest viable deliverable, and queue any external/public/money action for approval.</p><p><b>Input:</b> '+v.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))+'</p>':'<p>Enter an opportunity first.</p>'}</script></body></html>
